const animalPhrases=['главный по настроению','сегодня всё под контролем','я просто существую','не трогать до кофе','маленький хаос дня','я пришёл за вкусняшкой','делаем вид, что всё по плану','режим: красиво жить','ещё один хороший день','мне можно отдыхать','сегодня без драмы','пушистый менеджер дел','я выбираю уют','план на день: выжить','немного странности — это нормально'];
function animalOfDay(k=TODAY){const start=new Date(2026,0,1),dt=new Date(k);const idx=Math.floor((dt-start)/86400000);const a=animalList[(idx*7+idx)%animalList.length];const phrase=animalPhrases[(idx*3+2)%animalPhrases.length];return `<section class="animal-card"><div class="animal-sticker"><span class="animal-emoji" aria-label="Животное дня">${a}</span></div><div class="animal-copy"><div class="eyebrow">${new Date(k).toLocaleDateString('ru-RU',{day:'2-digit',month:'long'})}</div><h2>Животное дня</h2><p>${phrase}. Пусть хотя бы один момент сегодня будет просто смешным и хорошим.</p><span class="animal-tag">🐾 новый зверь сегодня</span></div></section>`}
function calendarMonth(m){
 const first=new Date(2026,m,1), total=new Date(2026,m+1,0).getDate(), start=(first.getDay()+6)%7;
 let cells=Array(start).fill('<span class="emptyday"></span>').join('');
 for(let d=1;d<=total;d++){
   const k=key(2026,m,d), isPast=k<TODAY, tr=trainingByDow[dow(2026,m,d)];
   cells+=`<button class="day ${k===TODAY?'today':''} ${isPast?'past':''} ${done(k)?'done':''}" onclick="openDay('${k}')">${d}${tr?'<i class="dot">♥</i>':''}</button>`;
 }
 return `<div class="month"><h3>${MONTHS[m]}</h3><div class="dow">${WEEK.map(x=>`<b>${x}</b>`).join('')}</div><div class="days">${cells}</div></div>`;
}
function nutritionHtml(){
 return `<div class="panel"><h2>🥗 Питание ≈ 1300 ккал • Vũng Tàu</h2>
 <div class="meals">
 <div class="meal"><b>🍳 Завтрак</b><span>2 яйца + рис 120 г готового + овощи 150 г</span><em>≈330 ккал</em></div>
 <div class="meal"><b>🍗 Обед</b><span>грудка 150 г готовой + рис 150 г готового + овощи 250 г</span><em>≈520 ккал</em></div>
 <div class="meal"><b>🥛 Перекус</b><span>йогурт натуральный без сахара 200 г</span><em>≈120 ккал</em></div>
 <div class="meal"><b>🥬 Ужин</b><span>грудка 100 г готовой + рис 100 г готового + овощи 250 г</span><em>≈330 ккал</em></div>
 </div>
 <p class="note">Ориентир ≈1300 ккал. Без сладкого и сладких напитков. Креветки можно иногда использовать вместо части грудки. Масло и соусы учитывай отдельно; конкретные калории зависят от упаковки и приготовления.</p>
 <div class="tag">🛒 Рис</div><div class="tag">🍗 Грудка</div><div class="tag">🥚 Яйца</div><div class="tag">🥦 Овощи</div><div class="tag">🥛 Йогурт без сахара</div><div class="tag">🦐 Креветки редко</div>
 </div>`;
}
function dayRoutine(dowNum){
 const shift=shifts[dowNum], training=trainingByDow[dowNum];
 const sleep=shift==='19:00–01:00'?'02:00–10:00':shift==='18:00–00:00'?'01:30–09:30':'01:00–09:00';
 const skin=skinCycle[(new Date(2026,8,22).getDate()+dowNum)%3];
 return `<div class="panel"><h3 class="sectiontitle">🕒 Расписание дня</h3>
 <div class="timeline">
 <div><b>☀️ Подъём</b><span>09:00–10:00</span></div><div><b>💧 Утро</b><span>вода · умывание · завтрак</span></div>
 <div><b>💻 Личное время</b><span>11:00–13:00</span></div><div><b>🍚 Обед</b><span>13:00</span></div>
 ${training?`<div><b>🏋️ Тренировка + йога</b><span>15:00–16:15</span></div>`:''}
 <div><b>🚿 Душ + уход перед работой</b><span>${shift==='Выходной'?'18:00':'за 45–60 мин'}</span></div>
 <div><b>💼 Работа</b><span>${shift}</span></div><div><b>🌙 Сон</b><span>${sleep}</span></div>
 </div>
 <p><span class="tag">✨ Сегодня: ${skin}</span><span class="tag">🧴 после душа: руки · локти · колени · ступни</span></p>
 </div>`;
}
function openDay(k){
 const [y,mo,d]=k.split('-').map(Number), dn=dow(y,mo-1,d), tr=trainingByDow[dn], isD=done(k);
 const ex=tr?`<div class="panel"><h3 class="sectiontitle">🏋️ ${trainingNames[tr]} + резинка</h3>${exercises[tr].map((e,i)=>exerciseCard(e,i)).join('')}<p class="small">🧘 После комплекса: 15–20 минут спокойной йоги/растяжки.</p></div>`:'';
 const notes=state[k]?.notes||'';
 document.getElementById('modal')?.remove();
 const el=document.createElement('div');el.className='modal';el.id='modal';
 el.innerHTML=`<div class="modalbox"><div class="modalhead"><div><span class="tag">${WEEK[dn]} · ${d}.${String(mo).padStart(2,'0')}.2026</span><h1 style="margin:8px 0;color:var(--deep)">${d} ${MONTHS[mo-1]}</h1></div><div><button class="complete ${isD?'done':''}" onclick="toggleDone('${k}')">${isD?'✓ День отмечен':'✓ Отметить день'}</button> <button class="close" onclick="closeDay()">×</button></div></div>
 ${animalOfDay(k)}
 <div class="daygrid"><div>${dayRoutine(dn)}${nutritionHtml()}</div><div>${ex}<div class="panel"><h3 class="sectiontitle">📝 Моё на сегодня</h3><textarea id="notes" placeholder="Запиши свои дела, важные даты, настроение, что хочешь не забыть...">${esc(notes)}</textarea><button class="complete" style="margin-top:8px" onclick="saveNotes('${k}')">Сохранить</button></div><div class="panel"><h3 class="sectiontitle">☑️ Ежедневно</h3><div class="checks">${['Вода','Питание по плану','Уход за собой','Увлажнение после душа','Личное время','Шаг к отказу от курения'].map(x=>`<label><input type="checkbox"> ${x}</label>`).join('')}</div></div></div></div></div>`;
 document.body.appendChild(el);
}
function saveNotes(k){state[k]??={};state[k].notes=document.getElementById('notes').value;save();alert('Сохранено 💚')}
function closeDay(){document.getElementById('modal')?.remove()}
function render(){
 document.getElementById('root').innerHTML=`<div class="app">
 <header class="hero"><div><span class="sticker">✨ мой 2026</span><h1>DOPAMINE<br><i>PLANNER</i></h1><p>КРАСНЫЙ · РОЗОВЫЙ · ШОКОЛАДНЫЙ · ЗЕЛЁНЫЙ · ПОЛОСКИ · СТИКЕРЫ · МАЛЕНЬКИЕ ПОБЕДЫ</p></div><div class="today"><small>СЕГОДНЯ</small><strong>22</strong><b>сентября · вторник</b><div style="margin-top:5px;font-size:11px">сегодня отмечено жёлтым в календаре</div></div></header>
 ${animalOfDay(TODAY)}
 ${memeOfDay()}
 <div class="nav"><button onclick="openDay(TODAY)">💚 Открыть сегодня</button><button onclick="document.getElementById('calendar').scrollIntoView({behavior:'smooth'})">📅 2026</button><button onclick="document.getElementById('workouts').scrollIntoView({behavior:'smooth'})">🏋️ Тренировки</button><button onclick="document.getElementById('food').scrollIntoView({behavior:'smooth'})">🥗 Питание</button></div>
 <div class="layout"><main>
 <section class="panel" id="calendar"><h2>📅 Весь 2026 — нажми на любой день</h2><div class="calendar">${Array.from({length:12},(_,m)=>calendarMonth(m)).join('')}</div><div class="legend">♥ = день с тренировкой · жёлтый = сегодня · бледный = прошедший день · почти прозрачный = отмечен как выполненный</div></section>
 <section class="panel" id="workouts"><h2>🏋️ Домашние тренировки с резинкой</h2><div class="workouts">${Object.entries(exercises).map(([id,arr])=>`<div class="workout-card"><h3>${id} — ${trainingNames[id]}</h3>${arr.map((e,i)=>exerciseCard(e,i)).join('')}<div class="quote">+ 15–20 мин йоги после тренировки</div></div>`).join('')}</div></section>
 ${nutritionHtml()}
 <section class="panel"><h2>🧴 Уход и бытовые дела</h2><div class="checks">${['Каждый день: увлажнить руки, локти, колени и ступни после душа','Пн: эссенция от чёрных точек','Вт: тканевая маска','Ср: эссенция с брусникой','Чт: эссенция от чёрных точек','Пт: тканевая маска','Сб: эссенция с брусникой','Вс: эссенция от чёрных точек','Пятница: уборка + стирка вещей','Раз в неделю: маникюр + педикюр'].map(x=>`<label><input type="checkbox"> ${x}</label>`).join('')}</div></section>
 </main><aside class="side">
 <section class="panel"><h2>💼 График работы</h2>${[1,2,3,4,5,6,0].map(d=>`<div class="timeline"><div><b>${['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][d]}</b><span>${shifts[d]}</span></div></div>`).join('')}</section>
 <section class="panel"><h2>🎀 Цели</h2>${['Наладить сон','Тренировки 4×/нед','Йога после тренировок','Питание ≈1300 ккал','Больше личного времени','Постепенно бросить курить','Уход за собой','Уютный порядок дома'].map(x=>`<label><input type="checkbox"> ${x}</label>`).join('')}</section>
 <section class="panel"><h2>🚭 Курение</h2><p class="small">Отмечай маленькие шаги: меньше сигарет → больше времени между ними → дни без сигарет.</p><div class="progress"><i></i></div></section>
 <section class="panel"><p class="quote">«Маленькие шаги тоже считаются. Я выбираю себя ♥»</p></section>
 </aside></div></div>`;
}
window.openDay=openDay;window.closeDay=closeDay;window.toggleDone=toggleDone;window.saveNotes=saveNotes;render();
</script>
